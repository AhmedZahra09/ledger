name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project files
        run: bash setup.sh
      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name digital_ledger
      - name: Download Cairo font
        run: |
          mkdir -p assets/fonts
          U="https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"
          curl -fL -o assets/fonts/Cairo-Regular.ttf "$U"
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Bold.ttf
      - name: Add permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_SMS"/><uses-permission android:name="android.permission.RECEIVE_SMS"/><queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries><application|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
